        - text: "npx alan-del-toro"
          style: cmd
        - text: " --init"
          style: flag
    - segments:
        - text: "→ Cargando perfil profesional..."
          style: dim
    - segments:
        - text: "✓ "
          style: success
        - text: "Alan del Toro"
          style: cmd
        - text: " — Software Engineer & Web Developer"
          style: dim
    - segments:
        - text: "→ Especialidad: "
          style: dim
        - text: "Vue.js, Nuxt (Nuxt UI) & Node.js"
          style: metric-good
    - segments:
        - text: "→ Enfoque: "
          style: dim
        - text: "Plataformas SaaS, CRM & Microservicios"
